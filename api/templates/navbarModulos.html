<nav id="navbar-principal" class="navbar bg-body-tertiary">
    <a class="navbar-brand" href="{{ url_for('routes.homepage') }}">
        <img src="{{ url_for('static', filename='assets/404.png') }}" alt="Logo" class="img-fluid">
    </a>

    <div class="dropdown" id="menuDropdownModulos">
      <button class="menu-btn-modulos">☰</button>
      <div class="dropdown-content-modulos">
        <a href="{{ url_for('routes.homepage') }}">⬅ Voltar Home</a>
        <a href="{{ url_for('routes.conteudo') }}">Conteúdos</a>
        <a href="{{ url_for('routes.module_route', module_name='modulo1', section_name='modulo1') }}">Módulo 1</a>
          <div class="submenu">
            <a href="{{ url_for('routes.module_route', module_name='modulo1', section_name='modulo1') }}">Seção 1</a>
            <a href="{{ url_for('routes.module_route', module_name='modulo1', section_name='modulo1s2') }}">Seção 2</a>
          </div>
        <a href="{{ url_for('routes.module_route', module_name='modulo2', section_name='modulo2') }}">Módulo 2</a>
        <a href="{{ url_for('routes.module_route', module_name='modulo3', section_name='modulo3') }}">Módulo 3</a>
        <a href="{{ url_for('routes.module_route', module_name='modulo4', section_name='modulo4') }}">Módulo 4</a>
        <a href="{{ url_for('routes.module_route', module_name='modulo5', section_name='modulo5') }}">Módulo 5</a>
        <a href="{{ url_for('routes.module_route', module_name='modulo6', section_name='modulo6') }}">Módulo 6</a>
        <a href="{{ url_for('routes.module_route', module_name='sobre-equipe', section_name='sobre-equipe') }}">Sobre o Projeto</a>

      </div>
    </div>
    {% block navbar_extra %}{% endblock %}
</nav>

<style>
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 1rem;
  background-color: rgb(238, 236, 231);
}

.navbar-brand img {
  max-height: 80px;
  width: auto;
  display: block;
}

@media (min-width: 768px) {
  .navbar-brand img {
    max-height: 80px;
  }
}

@media (max-width: 420px) {
  .navbar {
    padding: 0.3rem 0.5rem;
    gap: 0.5rem;
  }

  .navbar-brand img {
    max-height: 40px;
  }

}
.menu-btn-modulos {
      font-size: 2rem;
      background: none;
      border: none;
      color: #051E30;
      cursor: pointer;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content-modulos {
      font-family: 'Poppins', sans-serif;
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 200px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
      z-index: 1;
    }

    .dropdown-content-modulos a {
      display: block;
      padding: 12px 16px;
      text-decoration: none;
      color: #051E30;
      font-weight: bold;
    }

    .dropdown-content-modulos a:hover {
      background-color:  hsl(180, 45%, 55%);
      color: #fff;
    }

    .submenu {
      background-color: #f9f9f9;
      padding-left: 20px;
    }

    .active {
      background-color: hsl(180, 45%, 55%);
      color: #fff !important;
    }

    .dropdown.show .dropdown-content-modulos {
      display: block;
    }
</style>

<script>
    // Script para o dropdown do navbar dos módulos
    const menuBtnModulos = document.querySelector('.menu-btn-modulos');
    const dropdownModulos = document.getElementById('menuDropdownModulos');

    if (menuBtnModulos && dropdownModulos) {
      menuBtnModulos.addEventListener('click', (e) => {
        e.stopPropagation(); // Impede que o clique se propague para o document
        dropdownModulos.classList.toggle('show');
      });

      document.addEventListener('click', (e) => {
        if (!dropdownModulos.contains(e.target)) {
          dropdownModulos.classList.remove('show');
        }
      });
    }
</script>
