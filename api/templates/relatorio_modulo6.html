<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Planejamento da Sprint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 20px;
            background-color: white;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #0056b3;
            margin: 0;
        }
        .bloco-pergunta {
            margin-bottom: 20px;
            page-break-inside: avoid;
        }
        .pergunta {
            font-size: 16px;
            font-weight: bold;
            color: #0056b3;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .resposta {
            background-color: #f9f9f9;
            border-left: 4px solid #0056b3;
            padding: 10px;
            font-size: 14px;
            color: #333;
            white-space: pre-wrap; /* Preserva quebras de linha */
        }
    </style>
</head>
<body>
    <header>
        <h1>Relatório de Planejamento da Sprint</h1>
        <p style="color: #555; font-size: 14px; margin-top: 5px;">Gerado em: {{ data_atual }}</p>
    </header>

    <div class="bloco-pergunta">
        <div class="pergunta">1. Qual é a Meta da Sprint?</div>
        <div class="resposta">{{ meta_sprint or "Não preenchido" }}</div>
    </div>

    <div class="bloco-pergunta">
        <div class="pergunta">2. Itens do Backlog Selecionados</div>
        <div class="resposta">{{ backlog_itens or "Não preenchido" }}</div>
    </div>

    <div class="bloco-pergunta">
        <div class="pergunta">3. Riscos e Impedimentos Potenciais</div>
        <div class="resposta">{{ riscos or "Não preenchido" }}</div>
    </div>
</body>
</html>
