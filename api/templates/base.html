<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}404 - Curso de Scrum{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen">

    {% block navbar %}
        {% include "navbar.html" %}
    {% endblock %}

    <main class="flex-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer" style="background-color: #051E30; padding: 2rem 0; text-align: center;">
        <div class="container">
            <p class="footer-text" style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">Copyright © 2025 | Todos os direitos reservados</p>
        </div>
    </footer>

    {% block body_scripts %}
    <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>

    <script>
        // Script para o dropdown do navbar (menu mobile)
        const menuBtn = document.querySelector('.menu-btn');
        const dropdown = document.getElementById('menuDropdown');
    
        if (menuBtn && dropdown) {
          menuBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Impede que o clique se propague para o document
            dropdown.classList.toggle('show');
          });
    
          document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target)) {
              dropdown.classList.remove('show');
            }
          });
        }
    </script>
{% endblock %}

<!-- Início do widget Vlibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
  <!-- Fim do widget Vlibras -->

</body>
</html>
